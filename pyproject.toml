[project]
name = "mobilizon-event-sync"
version = "0.0.1"
description = "Sync events from various sources into Mobilizon groups as native events."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "icalendar>=5.0",
    "python-dateutil>=2.9",
    "tzdata; sys_platform == 'win32'",
    "requests>=2.31",
]

[project.scripts]
mobilizon-event-sync = "mobilizon_ical_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mobilizon_ical_sync*"]
